[settings]
activate_aggressive = true # mise shims win over other PATH entries

[settings.github]
credential_command = 'gh auth token'

[tools]
atuin = { version = "18.22.0", os = ["linux"] }
ripgrep = { version = "15.2.0", os = ["linux"] }
eza = { version = "0.23.5", os = ["linux"] }
zoxide = { version = "0.10.0", os = ["linux"] }
jq = { version = "1.8.2", os = ["linux"] }
yq = { version = "4.54.1", os = ["linux"] }
tmux = { version = "3.7c", os = ["linux"] }
yamlfmt = { version = "0.21.0", os = ["linux"] }
github-cli = { version = "2.101.0", os = ["linux"] }
neovim = { version = "0.12.6", os = ["linux"] }
worktrunk = { version = "0.81.0", os = ["linux"] }
kubectx = { version = "0.9.5", os = ["macos"] }
kubens = { version = "0.9.5", os = ["macos"] }
usage = '6.12.0'
go = '1.27.1'
golangci-lint = '2.13.2'
node = "24.13.1"
"npm:ccstatusline" = '2.2.34'
