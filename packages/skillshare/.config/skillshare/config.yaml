# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

# Skills come from stow and the barrydobson-skills plugin, not skillshare. It only syncs
# MCP servers, hooks and plugins to these targets.
targets:
  claude: {}
  codex: {}
ignore:
  - .DS_Store
  - .git/
  - __pycache__/
audit:
  block_threshold: CRITICAL
plugins:
  version: 2
  packages:
    barrydobson-skills:
      source: https://github.com/barrydobson/skills
      plugin: barrydobson-skills
      bindings:
        claude:
          imported: true
        codex:
          source: https://github.com/barrydobson/skills
          plugin: barrydobson-skills
    claude-md-management:
      bindings:
        claude:
          imported: true
    codex:
      bindings:
        claude:
          imported: true
    next-steps:
      bindings:
        claude:
          imported: true
    ponytail:
      bindings:
        claude:
          imported: true
        codex:
          source: https://github.com/DietrichGebert/ponytail
          plugin: ponytail
    tokeneconomizer:
      bindings:
        claude:
          imported: true
    tote-issue-tracker:
      bindings:
        claude:
          imported: true
hooks:
  entries:
    session-context:
      bindings:
        codex:
          events:
            SessionStart:
              - hooks:
                  - command: bash "$HOME/.claude/hooks/systems-note-context.sh"
                    timeout: 5
                    type: command
                  - command: bash "$HOME/.claude/hooks/hc-context.sh"
                    timeout: 5
                    type: command
mcp:
  servers:
    granola:
      transport: streamable-http
      url: https://mcp.granola.ai/mcp
      targets:
        - claude
        - codex
    groundcover:
      transport: streamable-http
      url: https://mcp.groundcover.com/api/mcp
      targets:
        - claude
        - codex
    notion:
      transport: streamable-http
      url: https://mcp.notion.com/mcp
      targets:
        - claude
        - codex
    vault:
      command: npx
      args:
        - -y
        - '@modelcontextprotocol/server-filesystem'
        - /Users/barrydobson/vault/
      targets:
        - claude
        - codex
