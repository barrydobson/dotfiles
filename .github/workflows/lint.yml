name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x --source-path=SCRIPTDIR install.sh install/*.sh

  stow-packages-exist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every package named in an install script must exist
        run: |
          missing=0
          packages=$(awk '/^(COMMON|MAC|DEVCONTAINER)_PACKAGES=\(/{inside=1; next} inside && /^\)/{inside=0} inside{gsub(/[[:space:]]/,""); if ($0) print}' \
            install.sh install/devcontainer.sh | sort -u)
          for pkg in ${packages}; do
            if [[ ! -d "packages/${pkg}" ]]; then
              echo "::error::packages/${pkg} is listed in an install script but does not exist"
              missing=1
            fi
          done
          exit "${missing}"

  herdr-mod-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          # 24 runs the mods' ES modules without a package.json
          node-version: 24
      - run: node --test
        working-directory: packages/herdr-app/.config/herdr-app/mods

  # The Linux path of install.sh, end to end on a fresh runner. Logins stay manual.
  linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # mise downloads tools from GitHub releases; unauthenticated requests hit rate limits
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: ./install.sh </dev/null
      - name: Tools, skills and git signing are in place
        shell: bash
        run: |
          export PATH="${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${PATH}"
          failed=0
          check() { if eval "$2" >/dev/null 2>&1; then echo "ok    $1"; else echo "::error::$1"; failed=1; fi; }
          for bin in zsh nvim mise starship gh yq claude codex skillshare herdr-core wt; do
            check "${bin} on PATH" "command -v ${bin}"
          done
          check "Claude skills linked" "[ -n \"\$(ls ~/.claude/skills)\" ]"
          check "Codex skills linked" "[ -n \"\$(ls ~/.agents/skills)\" ]"
          check "Pinned skills restored" "[ -f \"\${HOME}/.config/skillshare/skills/archify/SKILL.md\" ]"
          check "Codex has barrydobson-skills" "codex plugin list | grep -q '^barrydobson-skills@'"
          check "Codex common config merged" "grep -q '^approval_policy' ~/.codex/config.toml"
          check "Git signing key configured" "git config --file ~/.config/git/.gitconfig-local --get user.signingkey"
          check "~/.dotfiles points at the clone" "[ \"\$(readlink ~/.dotfiles)\" = \"\${GITHUB_WORKSPACE}\" ]"
          check "zsh starts" "zsh -ic true"
          exit "${failed}"
